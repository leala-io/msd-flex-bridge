name: CI

on:
  push:
  pull_request:

# All six gates are active. Four run as their own steps; the fixture snapshot
# gate, the determinism gate and the validation gate run inside the test suite,
# where they can assert the reasons a snapshot is right rather than only that it
# has not changed.
#
# Two further steps run after the gates and are not among the six: the roundtrip,
# which produces the two feeds, and the canonical GTFS validator over both of
# them. The validator step is interoperability evidence, not a seventh gate — it
# fails only on an ERROR-severity notice in the generated feed and never on the
# original's own result, which is recorded and reported as a fact about a
# published feed.
#
# `npm ci` reaches the registry. The validator step fetches one pinned JAR and
# verifies its sha256 before running it — the single, explicit exception to the
# no-network rule, with its conditions stated in scripts/gtfs-validator.mjs and
# in docs/roundtrip.md. Nothing else reaches the network: the vendor drift check,
# the fixture assertions, the terminology check and the roundtrip are offline by
# construction, and the core makes no network call at runtime.
jobs:
  build:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Gate 1 — vendored artefacts are byte-identical to upstream at the pin.
      - name: Vendor drift check
        run: node scripts/check-vendor-drift.mjs

      # Gate 2 — src/core/** stays pure and deterministic. The checker itself is
      # tested from both sides in test/purity.test.js.
      - name: Purity check
        run: node scripts/check-purity.mjs

      # Gate 3 — the bundled feed still is what the build was written against.
      # Independent of the lift by design: it says WHERE a feed differs, before
      # any mapping code runs.
      - name: Fixture assertions
        run: npm run test:fixture

      # Gate 4 — the schema-versus-release version relationship, over tracked
      # files only, excluding vendor/. The pattern is in clear text: it names a
      # mistake, not a protected term.
      - name: Terminology check
        run: node scripts/check-terminology.mjs

      # Gates 5 and 6 — the fixture snapshot and determinism gates — plus the
      # validation gate and the fidelity tests that no gate would otherwise
      # catch: names verbatim, omission over invention, diagnostics separation
      # and the weekday vocabulary the schema leaves unconstrained.
      - name: Tests
        run: npm test

      # The snapshot must be reproducible from the committed sources alone. If
      # regenerating changes a byte, the committed snapshot is not what the
      # current lift produces. This covers the roundtrip diff report too.
      - name: Snapshots are reproducible
        run: |
          node scripts/write-snapshots.mjs
          git diff --exit-code -- test/fixtures/expected/

      # The committed card must be reproducible from the committed sources, for
      # the same reason the snapshots must be. This checks the FILE, not the
      # rendering: no step here opens a browser or measures a colour, and none
      # would notice an unreadable page. That check is human and is written down
      # as one in docs/card.md, where it is the condition for pushing.
      - name: Card is reproducible
        run: |
          node scripts/build-card.mjs
          git diff --exit-code -- card/

      # Not a gate — evidence. Writes the two feeds the validator then reads:
      # the bundled feed unpacked verbatim, and the feed the vendored exporter
      # produces from the lifted document. Offline and deterministic.
      - name: Roundtrip
        run: npm run roundtrip

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # THE ONE NETWORK EXCEPTION. Fetches gtfs-validator pinned at v8.0.1 and
      # verifies its sha256 before running it; a mismatch fails the step, so the
      # interoperability claim never rests on whatever a server returned that
      # day. The JAR is git-ignored and never committed.
      #
      # Runs over the generated feed AND the original. Fails only on an
      # ERROR-severity notice in the generated feed; the original's result is
      # recorded and reported, never enforced.
      - name: Canonical GTFS validator — both feeds
        run: npm run check:gtfs
