name: CI

on:
  push:
  pull_request:

# Four of the six gates are enforceable at this stage. The remaining two — the
# fixture snapshot gate and the determinism gate — arrive with the lift (P1.3)
# and are deliberately not stubbed here: a gate that asserts nothing reads as
# coverage without being any.
#
# `npm ci` reaches the registry; nothing else does. The vendor drift check, the
# fixture assertions and the compliance grep are offline by construction, and
# the core makes no network call at runtime.
jobs:
  build:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Gate 1 — vendored artefacts are byte-identical to upstream at the pin.
      - name: Vendor drift check
        run: node scripts/check-vendor-drift.mjs

      # Gate 2 — src/core/** stays pure and deterministic. The checker itself is
      # tested from both sides in test/purity.test.js.
      - name: Purity check
        run: node scripts/check-purity.mjs

      # Gate 3 — the bundled feed still is what the build was written against.
      # Independent of the lift by design: it says WHERE a feed differs, before
      # any mapping code runs.
      - name: Fixture assertions
        run: npm run test:fixture

      # Gate 4 — public terminology and framing, over tracked files only,
      # excluding vendor/. The forbidden terms are carried as hashes; the
      # clear-text list is untracked by design.
      - name: Compliance gate
        run: node scripts/check-compliance.mjs

      # The blocklist is generated from a term list that is deliberately absent
      # here. Out of date is a failure; absent source is not — it is simply
      # unverifiable in CI, and says so rather than passing quietly.
      - name: Blocklist currency
        run: |
          set +e
          node scripts/gen-blocklist.mjs --check
          status=$?
          set -e
          case $status in
            0) echo "blocklist verified current against the term list" ;;
            3) echo "::notice::term list absent in CI (untracked by design) — blocklist currency is UNVERIFIABLE here, not verified" ;;
            *) echo "::error::blocklist is out of date with respect to the term list — run: npm run blocklist"; exit $status ;;
          esac

      - name: Tests
        run: npm test
