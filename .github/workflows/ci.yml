name: CI

on:
  push:
  pull_request:

# All six gates are active. Four run as their own steps; the fixture snapshot
# gate, the determinism gate and the validation gate run inside the test suite,
# where they can assert the reasons a snapshot is right rather than only that it
# has not changed.
#
# `npm ci` reaches the registry; nothing else does. The vendor drift check, the
# fixture assertions and the terminology check are offline by construction, and
# the core makes no network call at runtime.
jobs:
  build:
    name: Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # Gate 1 — vendored artefacts are byte-identical to upstream at the pin.
      - name: Vendor drift check
        run: node scripts/check-vendor-drift.mjs

      # Gate 2 — src/core/** stays pure and deterministic. The checker itself is
      # tested from both sides in test/purity.test.js.
      - name: Purity check
        run: node scripts/check-purity.mjs

      # Gate 3 — the bundled feed still is what the build was written against.
      # Independent of the lift by design: it says WHERE a feed differs, before
      # any mapping code runs.
      - name: Fixture assertions
        run: npm run test:fixture

      # Gate 4 — the schema-versus-release version relationship, over tracked
      # files only, excluding vendor/. The pattern is in clear text: it names a
      # mistake, not a protected term.
      - name: Terminology check
        run: node scripts/check-terminology.mjs

      # Gates 5 and 6 — the fixture snapshot and determinism gates — plus the
      # validation gate and the fidelity tests that no gate would otherwise
      # catch: names verbatim, omission over invention, diagnostics separation
      # and the weekday vocabulary the schema leaves unconstrained.
      - name: Tests
        run: npm test

      # The snapshot must be reproducible from the committed sources alone. If
      # regenerating changes a byte, the committed snapshot is not what the
      # current lift produces.
      - name: Snapshots are reproducible
        run: |
          node scripts/write-snapshots.mjs
          git diff --exit-code -- test/fixtures/expected/
